# Example observation configuration using scan_const_el

# The observation_loop defines what to observe and when.
observation_loop:
  - LST: 0-24  # Observe at any time
    target_list:
      # This is the target definition for your constant elevation scan.
      # 1. 'type=scan_const_el' tells astrokat to use your new function.
      # 2. 'radec' provides the celestial target to center the scan on.
      # 3. 'duration' is required by the parser, but the actual scan duration
      #    is calculated from the scan parameters below. You can set it to 1.
      - name=MySource, radec=10:00:00, -30:00:00, type=scan_const_el, duration=1

# The 'scan' block provides the specific parameters for the scan.
# The scan_const_el function will look for these keys.
scan:
  # The total width of the scan in azimuth, in degrees.
  scan_width_az: 5.0

  # The speed of the scan in azimuth, in degrees per second.
  scan_speed_az: 0.5
